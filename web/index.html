<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Configurable DNS blocklists for Pi-hole, AdGuard Home and compatible DNS filters." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Universal Blocklist</title>
    <script>
      // Apply a stored theme before first paint to avoid a flash.
      try { var t = localStorage.getItem('ubl-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
