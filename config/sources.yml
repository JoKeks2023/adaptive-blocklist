# Source registry. Every source must be verified (URL reachable, format known,
# license documented) before it is set to `status: active`.
# Anything that could not be verified is kept as `status: pending` with the reason.
#
# Fields:
#   format             hosts | domains   (declared, never auto-detected)
#   min_entries        sanity floor; fewer valid domains => source marked too_small
#   max_invalid_ratio  fraction of non-matching entries tolerated (default 0.02)
#   required           false => a failing source does not fail its module (default true)
#   verified           date the URL/format/license were last checked by a human/agent
sources:
  stevenblack-unified:
    name: StevenBlack/hosts (unified hosts, adware + malware)
    url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    homepage: https://github.com/StevenBlack/hosts
    format: hosts
    license: MIT
    license_url: https://github.com/StevenBlack/hosts/blob/master/license.txt
    purpose: Consolidated, de-duplicated hosts file of reputable adware/malware sources; widely used for DNS blocking.
    verified: "2026-11-26"
    min_entries: 50000

  hagezi-popupads:
