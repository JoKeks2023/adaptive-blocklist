name: Deploy (manual redeploy note)

# Deployment lives in build.yml so that a deploy can only ever follow a
# successful, validated build. This workflow intentionally only documents that
# and offers a manual trigger that re-runs the full pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the full build-and-deploy pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
