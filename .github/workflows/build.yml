name: Build and deploy

# Rebuilds every list from the upstream sources, validates the result and
# publishes it to GitHub Pages. Generated files are never committed.
#
# Safety: `deploy` needs `build`, which needs `tests`. If any source fails or any
# validation fails, no job after it runs and the previous Pages version stays live.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "overrides/**"
      - "blocklist/**"
      - "web/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/validate.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Build lists (fails closed on any source/validation problem)
        run: python -m blocklist build --out web/public --report build/report.json
      - name: Re-validate generated files
        run: python -m blocklist validate --dir web/public
      - name: Upload build report (also on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-report
          path: build/report.json
          if-no-files-found: ignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Final check of the Pages artifact
        run: |
          test -s web/dist/index.html
          test -s web/dist/lists/profiles/desktop.txt
          test -s web/dist/data/catalog.json
          grep -q '"status": "ok"' web/dist/data/catalog.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
